<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PyMastery Cheat Sheet</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
        
        :root {
            --bg-color: #0b0f19;
            --surface: #131a2a;
            --text-primary: #f0f4f8;
            --text-secondary: #94a3b8;
            --accent: #00e5ff;
            --accent-glow: rgba(0, 229, 255, 0.4);
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; }
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            margin: 0; padding: 0; overflow-x: hidden;
            background-image: radial-gradient(circle at 15% 50%, rgba(0, 229, 255, 0.05), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.05), transparent 25%);
        }

        .header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(19, 26, 42, 0.8); backdrop-filter: saturate(180%) blur(20px);
            padding: 20px 40px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }

        .brand-container { display: flex; align-items: center; gap: 12px; }
        .logo-svg { width: 32px; height: 32px; filter: drop-shadow(0 0 8px var(--accent-glow)); }
        .brand-text { font-weight: 800; font-size: 1.4rem; letter-spacing: -0.5px; background: linear-gradient(90deg, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;}
        .subtitle { font-size: 0.9rem; color: var(--text-secondary); font-weight: 500; margin-left: 10px; border-left: 1px solid var(--border); padding-left: 10px; }

        .search-container { position: relative; width: 400px; }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }
        .search-input {
            width: 100%; padding: 12px 15px 12px 45px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            border-radius: 30px; font-family: 'Outfit', sans-serif; font-size: 1rem; color: #fff;
            transition: all 0.3s; outline: none;
        }
        .search-input:focus { border-color: var(--accent); background: rgba(0,229,255,0.05); box-shadow: 0 0 15px var(--accent-glow); }

        .container { display: flex; gap: 30px; padding: 40px; max-width: 1400px; margin: 0 auto; }

        /* Sticky TOC */
        .toc { width: 250px; position: sticky; top: 110px; height: calc(100vh - 150px); overflow-y: auto; padding-right: 20px;}
        .toc-title { font-size: 0.8rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px;}
        .toc-link { display: block; color: var(--text-secondary); text-decoration: none; font-size: 0.95rem; font-weight: 500; padding: 10px 15px; border-radius: 12px; margin-bottom: 5px; transition: all 0.2s;}
        .toc-link:hover, .toc-link.active { background: rgba(0, 229, 255, 0.1); color: var(--accent); }

        /* Main Content Grid */
        .grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 30px; align-items: start; }
        
        .card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
            padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); border-color: rgba(0, 229, 255, 0.3); }

        .card h2 { font-size: 1.4rem; font-weight: 700; color: #fff; margin-top: 0; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
        .card h2 .topic-badge { font-size: 0.75rem; background: rgba(0,229,255,0.1); color: var(--accent); padding: 4px 10px; border-radius: 10px; text-transform: uppercase; letter-spacing: 1px; }

        .code-container { position: relative; margin-bottom: 15px; }
        .code-block {
            background: #000; padding: 20px; border-radius: 12px;
            font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
            border: 1px solid rgba(255,255,255,0.1); color: #e2e8f0; overflow-x: auto;
        }
        
        .copy-btn {
            position: absolute; top: 10px; right: 10px;
            background: rgba(255,255,255,0.1); border: none; color: #fff;
            padding: 5px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s;
        }
        .copy-btn:hover { background: var(--accent); color: #000; }

        .desc { font-size: 0.95rem; color: var(--text-secondary); line-height: 1.6; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-corner { background: transparent; }

    </style>
</head>
<body>

    <div class="header">
        <div class="brand-container">
            <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#0077ff;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <rect x="10" y="10" width="40" height="40" rx="12" fill="url(#grad1)" opacity="0.8"/>
                <rect x="50" y="50" width="40" height="40" rx="12" fill="url(#grad1)"/>
                <circle cx="30" cy="30" r="6" fill="#0b0f19"/>
                <circle cx="70" cy="70" r="6" fill="#0b0f19"/>
            </svg>
            <div class="brand-text">PyMastery <span class="subtitle">Cheat Sheet</span></div>
        </div>
        
        <div class="search-container">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Search syntax, functions, or concepts..." onkeyup="filterCards()">
        </div>
    </div>

    <div class="container">
        <div class="toc" id="toc">
            <div class="toc-title">Quick Jump</div>
            <!-- TOC Links injected via JS -->
        </div>

        <div class="grid" id="grid">
            <!-- Cards injected via JS -->
        </div>
    </div>

    <script src="curriculum.js"></script>
    <script>
        const grid = document.getElementById('grid');
        const toc = document.getElementById('toc');
        let cardData = [];

        // Compile logic from curriculum
        for (const phase in curriculum) {
            curriculum[phase].forEach(lesson => {
                cardData.push({
                    title: lesson.title,
                    phase: phase,
                    code: lesson.starter_code,
                    desc: lesson.theory.substring(0, 150) + "..."
                });
            });
        }

        function render() {
            let html = '';
            let tocHtml = '<div class="toc-title">Quick Jump</div>';
            
            cardData.forEach((c, index) => {
                const searchStr = (c.title + " " + c.phase + " " + c.desc).toLowerCase();
                const id = `card-${index}`;
                
                tocHtml += `<a href="#${id}" class="toc-link">${c.title}</a>`;

                html += `
                <div class="card" id="${id}" data-search="${searchStr}">
                    <h2>${c.title} <span class="topic-badge">${c.phase.split(' ')[1] || c.phase}</span></h2>
                    <div class="code-container">
                        <button class="copy-btn" onclick="copyCode(this, \`${c.code.replace(/`/g, '\\`')}\`)">Copy</button>
                        <div class="code-block">${c.code}</div>
                    </div>
                    <div class="desc">${c.desc}</div>
                </div>
                `;
            });

            grid.innerHTML = html;
            toc.innerHTML = tocHtml;
        }

        function filterCards() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                const str = card.getAttribute('data-search');
                if (str.includes(query)) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }
            });
        }

        function copyCode(btn, codeStr) {
            navigator.clipboard.writeText(codeStr);
            btn.innerText = "Copied!";
            btn.style.background = "var(--success)";
            setTimeout(() => {
                btn.innerText = "Copy";
                btn.style.background = "rgba(255,255,255,0.1)";
            }, 2000);
        }

        render();
    </script>
</body>
</html>
