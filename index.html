<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyMastery - Custom Edition</title>
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
        
        :root {
            --bg-color: #0b0f19;
            --surface: #131a2a;
            --text-primary: #f0f4f8;
            --text-secondary: #94a3b8;
            --accent: #00e5ff;
            --accent-glow: rgba(0, 229, 255, 0.4);
            --accent-purple: #a855f7;
            --border: rgba(255, 255, 255, 0.08);
            --success: #10b981;
            --error: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            display: flex; height: 100vh; overflow: hidden; 
            -webkit-font-smoothing: antialiased; 
            background-image: radial-gradient(circle at 15% 50%, rgba(0, 229, 255, 0.05), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.05), transparent 25%);
        }

        /* --- CUSTOM LOGO & BRANDING --- */
        .brand-container { display: flex; align-items: center; gap: 12px; }
        .logo-svg { width: 32px; height: 32px; filter: drop-shadow(0 0 8px var(--accent-glow)); }
        .brand-text { font-weight: 800; font-size: 1.4rem; letter-spacing: -0.5px; background: linear-gradient(90deg, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;}

        /* --- BESPOKE PILL NAV --- */
        .top-nav { position: fixed; top: 0; left: 0; width: 100%; height: 70px; background: rgba(19, 26, 42, 0.8); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; z-index: 1000; }
        .menu-toggle { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-primary); transition: transform 0.2s; display: flex; align-items:center; justify-content:center;}
        .menu-toggle:hover { transform: scale(1.1); color: var(--accent); }

        .nav-actions { display: flex; align-items: center; gap: 15px; }
        
        .pill-btn {
            background: rgba(255,255,255,0.05); color: var(--text-primary); border: 1px solid var(--border);
            padding: 8px 20px; border-radius: 30px; font-size: 0.9rem; font-weight: 600; cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; align-items: center; gap: 8px; text-decoration: none;
        }
        .pill-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); transform: translateY(-2px); }
        
        .pill-primary { background: linear-gradient(135deg, var(--accent), #00b4d8); color: #000; border: none; box-shadow: 0 4px 15px var(--accent-glow); }
        .pill-primary:hover { background: linear-gradient(135deg, #00f0ff, #00c3eb); transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); }
        
        .pill-purple { background: linear-gradient(135deg, var(--accent-purple), #7e22ce); color: #fff; border: none; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3); }
        .pill-purple:hover { background: linear-gradient(135deg, #b062ff, #8a2ce4); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4); }

        /* --- SIDEBAR FREE ROAM --- */
        .sidebar { width: 320px; height: calc(100vh - 70px); margin-top: 70px; background: var(--surface); border-right: 1px solid var(--border); padding: 25px 15px; overflow-y: auto; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: absolute; left: 0; z-index: 900; }
        .sidebar.collapsed { transform: translateX(-320px); }
        
        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        
        .nav-group { margin-bottom: 25px; }
        .nav-title { font-size: 0.75rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; padding-left: 10px; display: flex; align-items:center; gap: 8px;}
        
        .nav-item { padding: 12px 15px; border-radius: 12px; cursor: pointer; font-size: 0.95rem; font-weight: 500; display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; transition: all 0.2s; border: 1px solid transparent;}
        .nav-item:hover { background: rgba(255,255,255,0.03); border-color: var(--border); }
        .nav-item.active { background: rgba(0, 229, 255, 0.1); color: var(--accent); border-color: rgba(0, 229, 255, 0.2); font-weight: 600; box-shadow: inset 4px 0 0 var(--accent);}
        
        .status-pill { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; background: rgba(255,255,255,0.1); color: var(--text-secondary); font-weight: 600;}
        .status-pill.done { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .status-pill.active { background: var(--accent-glow); color: var(--accent); }

        /* --- MAIN CONTENT & TYPOGRAPHY --- */
        .main-content { flex: 1; height: calc(100vh - 70px); margin-top: 70px; margin-left: 320px; padding: 40px; overflow-y: auto; display: flex; justify-content: center; transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .main-content.expanded { margin-left: 0; }
        .lesson-container { background: var(--surface); border-radius: 24px; padding: 50px; max-width: 900px; width: 100%; border: 1px solid var(--border); height: fit-content; margin-bottom: 50px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);}

        h1 { font-size: 2.8rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 30px; line-height: 1.2; color: #fff;}
        h2 { font-size: 1.5rem; font-weight: 600; margin-top: 35px; margin-bottom: 15px; color: var(--accent);}
        h3 { font-size: 1.2rem; font-weight: 600; color: #fff; margin-bottom: 10px;}
        p { line-height: 1.7; color: var(--text-secondary); margin-bottom: 20px; font-size: 1.05rem;}
        strong { color: #fff; }

        /* Tabs */
        .tabs { display: flex; gap: 12px; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 15px; overflow-x: auto;}
        .tab-btn { background: none; border: none; font-size: 1rem; font-weight: 600; color: var(--text-secondary); padding: 10px 20px; cursor: pointer; border-radius: 30px; transition: all 0.2s; white-space: nowrap; font-family: 'Outfit', sans-serif;}
        .tab-btn:hover { background: rgba(255,255,255,0.05); color: #fff;}
        .tab-btn.active { color: var(--bg-color); background: #fff; }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Code & Breakdown */
        .code-block { background: #000; padding: 25px; border-radius: 16px; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; overflow-x: auto; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1); color: #e2e8f0; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);}
        
        .breakdown-box { background: rgba(0, 229, 255, 0.03); border: 1px solid rgba(0, 229, 255, 0.1); border-radius: 16px; padding: 25px; margin-top: 20px; }
        .breakdown-line { margin-bottom: 12px; font-size: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 12px; color: var(--text-secondary);}
        .breakdown-line:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0;}
        .breakdown-line strong, .breakdown-line code { font-family: 'JetBrains Mono', monospace; background: rgba(0,0,0,0.3); padding: 3px 8px; border-radius: 6px; color: var(--accent); font-size: 0.9rem;}

        /* Cards */
        .interview-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 16px; padding: 25px; margin-bottom: 20px; transition: transform 0.2s; }
        .interview-card:hover { transform: translateX(5px); border-color: rgba(255,255,255,0.1); }
        .interview-q { font-weight: 600; font-size: 1.15rem; color: #fff; margin-bottom: 12px; display: flex; gap: 10px;}
        .interview-a { color: var(--text-secondary); font-size: 1.05rem; line-height: 1.6;}

        /* Quizzes */
        .quiz-card { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 16px; padding: 30px; margin-bottom: 30px; }
        .quiz-q { font-weight: 600; font-size: 1.2rem; margin-bottom: 20px; color: #fff;}
        .quiz-opt { background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 15px 20px; border-radius: 12px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; font-size: 1rem; font-weight: 500; color: var(--text-primary);}
        .quiz-opt:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); }
        .quiz-opt.wrong { border-color: var(--error); background: rgba(239, 68, 68, 0.1); color: #ff8a8a; animation: shake 0.4s; }
        .quiz-opt.correct { border-color: var(--success); background: rgba(16, 185, 129, 0.1); color: #6ee7b7; pointer-events: none; box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);}
        .quiz-opt.disabled { pointer-events: none; opacity: 0.5; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }

        /* PyScript IDE */
        .editor-container { border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);}
        py-repl { --py-repl-background: #000; --py-repl-color: #f0f4f8; font-family: 'JetBrains Mono', monospace;}
        
        .verify-box { background: rgba(168, 85, 247, 0.05); border: 1px solid rgba(168, 85, 247, 0.2); padding: 30px; border-radius: 16px; margin-bottom: 40px; }
        .verify-input { width: 100%; padding: 15px 20px; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; font-size: 1rem; font-family: 'JetBrains Mono', monospace; margin-top: 15px; margin-bottom: 20px; outline: none; background: #000; color: #fff;}
        .verify-input:focus { border-color: var(--accent-purple); box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);}
        
        .submit-btn { float: right; font-family: 'Outfit', sans-serif;}

        /* --- DRAGGABLE VIDEO PILL --- */
        .floating-video {
            position: fixed; bottom: 30px; right: 30px; width: 420px; height: 260px;
            background: #000; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            z-index: 10000; display: none; flex-direction: column; overflow: hidden;
            transform: translate3d(0, 0, 0); border: 1px solid rgba(255,255,255,0.1);
        }
        .floating-video.active { display: flex; }
        .video-header {
            background: rgba(255,255,255,0.05); color: #fff; padding: 12px 20px; cursor: grab;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.95rem; font-weight: 600; user-select: none; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .video-header:active { cursor: grabbing; }
        .floating-video iframe { flex: 1; width: 100%; border: none; }
        .close-video { background: none; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; line-height: 1; transition: color 0.2s;}
        .close-video:hover { color: #fff; }

    </style>
</head>
<body>

    <!-- Floating Draggable Video -->
    <div class="floating-video" id="floatVideo">
        <div class="video-header" id="videoHeader">
            <span>📺 ML Masterclass (11 Hrs)</span>
            <button class="close-video" onclick="toggleVideo()">×</button>
        </div>
        <iframe src="https://www.youtube.com/embed/QGAuolgCTHE" allowfullscreen></iframe>
    </div>

    <!-- Top Navigation -->
    <div class="top-nav">
        <div style="display:flex; align-items:center; gap: 25px;">
            <button class="menu-toggle" onclick="toggleSidebar()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="brand-container">
                <!-- Custom SVG Logo -->
                <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#0077ff;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect x="10" y="10" width="40" height="40" rx="12" fill="url(#grad1)" opacity="0.8"/>
                    <rect x="50" y="50" width="40" height="40" rx="12" fill="url(#grad1)"/>
                    <circle cx="30" cy="30" r="6" fill="#0b0f19"/>
                    <circle cx="70" cy="70" r="6" fill="#0b0f19"/>
                </svg>
                <div class="brand-text">PyMastery</div>
            </div>
        </div>
        <div class="nav-actions">
            <button class="pill-btn" onclick="toggleLanguage()" id="langToggle">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                EN
            </button>
            <button class="pill-btn" onclick="toggleVideo()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                PIP Video
            </button>
            <a href="cheatsheet.html" target="_blank" class="pill-btn pill-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Cheat Sheet
            </a>
            <a href="flashcards.html" target="_blank" class="pill-btn pill-purple">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M7 8h10"></path><path d="M7 12h10"></path><path d="M7 16h10"></path></svg>
                Interview Cards
            </a>
            <div class="player-profile" style="display:flex; align-items:center; gap: 15px; margin-left: 20px; border-left: 1px solid var(--border); padding-left: 20px;">
                <div id="levelBadge" style="font-weight: 800; color: var(--accent-purple); font-size: 1.1rem; text-transform: uppercase;">Lvl 1</div>
                <div style="width: 100px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden;">
                    <div id="xpFill" style="width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-purple)); transition: width 0.4s ease;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Free Roam Sidebar -->
    <div class="sidebar" id="sidebar"></div>

    <div class="main-content" id="mainContent">
        <div class="lesson-container" id="lessonContainer"></div>
    </div>

    <script src="curriculum.js"></script>
    <script>
        // --- Draggable Video Logic ---
        const floatVideo = document.getElementById('floatVideo');
        const videoHeader = document.getElementById('videoHeader');
        let isDragging = false; 
        let currentX, currentY, initialX, initialY;
        let xOffset = 0, yOffset = 0;

        videoHeader.addEventListener("mousedown", dragStart);
        document.addEventListener("mouseup", dragEnd);
        document.addEventListener("mousemove", drag);

        function dragStart(e) {
            initialX = e.clientX - xOffset;
            initialY = e.clientY - yOffset;
            if (e.target === videoHeader || e.target.parentNode === videoHeader) { isDragging = true; }
        }
        function dragEnd(e) { initialX = currentX; initialY = currentY; isDragging = false; }
        function drag(e) {
            if (isDragging) {
                e.preventDefault();
                currentX = e.clientX - initialX; 
                currentY = e.clientY - initialY;
                xOffset = currentX; 
                yOffset = currentY;
                setTranslate(currentX, currentY, floatVideo);
            }
        }
        function setTranslate(xPos, yPos, el) { el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0)`; }
        function toggleVideo() { floatVideo.classList.toggle('active'); }

        // --- Language State Logic ---
        let currentLang = localStorage.getItem('pm_lang') || 'en';
        updateLangBtn();

        function updateLangBtn() {
            document.getElementById('langToggle').innerHTML = currentLang === 'en' 
                ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg> EN' 
                : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg> தமிழ்';
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ta' : 'en';
            localStorage.setItem('pm_lang', currentLang);
            updateLangBtn();
            if (currentLesson) loadLesson(currentGlobalIndex); // Re-render text
        }

        // --- UI Logic ---
        let sidebarOpen = true;
        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            document.getElementById('sidebar').classList.toggle('collapsed', !sidebarOpen);
            document.getElementById('mainContent').classList.toggle('expanded', !sidebarOpen);
        }

        // --- Free Roam Engine ---
        // We track completed lessons just for visual feedback, but NOTHING is locked.
        let completedSet = new Set(JSON.parse(localStorage.getItem('pm_completed') || '[]'));
        
        let flatCurriculum = [];
        for (const phase in curriculum) {
            curriculum[phase].forEach(topic => { flatCurriculum.push({ ...topic, phaseName: phase }); });
        }

        function renderSidebar() {
            let html = ''; let globalIndex = 0;
            for (const phase in curriculum) {
                // Determine icon based on phase name
                let phaseIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg>';
                if (phase.includes("Machine Learning")) { phaseIcon = '🤖'; }
                else if (phase.includes("Intermediate")) { phaseIcon = '⚡'; }
                else if (phase.includes("Advanced")) { phaseIcon = '🔥'; }

                html += `<div class="nav-group"><div class="nav-title">${phaseIcon} ${phase}</div>`;
                curriculum[phase].forEach((topic) => {
                    let isCompleted = completedSet.has(globalIndex);
                    let isActive = (globalIndex === currentGlobalIndex);
                    
                    let statusHtml = isActive ? '<span class="status-pill active">NOW</span>' : 
                                    (isCompleted ? '<span class="status-pill done">DONE</span>' : '<span class="status-pill">OPEN</span>');
                    
                    let activeClass = isActive ? 'active' : '';

                    html += `<div class="nav-item ${activeClass}" onclick="loadLesson(${globalIndex})">
                                <span>${topic.title}</span> 
                                ${statusHtml}
                             </div>`;
                    globalIndex++;
                });
                html += `</div>`;
            }
            document.getElementById('sidebar').innerHTML = html;
        }

        // --- Lesson Engine ---
        let currentGlobalIndex = 0;
        let currentLesson = null;

        function loadLesson(gIndex) {
            currentGlobalIndex = gIndex;
            currentLesson = flatCurriculum[gIndex];
            
            renderSidebar(); 

            // LANGUAGE RESOLUTION
            let theoryData = currentLang === 'ta' && currentLesson.theory_tamil ? currentLesson.theory_tamil : currentLesson.theory;
            let theoryHtml = `<p>${theoryData}</p>`;

            let codeHtml = `<div class="code-block"><pre>${currentLesson.code}</pre></div>`;
            if (currentLesson.code_breakdown) {
                codeHtml += `<div class="breakdown-box">
                                <h3 style="margin-bottom:20px; color:var(--accent);">Line-by-Line Breakdown</h3>
                                ${currentLesson.code_breakdown.map(line => `<div class="breakdown-line">${line}</div>`).join('')}
                             </div>`;
            }

            let interviewHtml = '';
            if (currentLesson.interviews) {
                currentLesson.interviews.forEach(int => {
                    interviewHtml += `<div class="interview-card">
                            <div class="interview-q"><span style="color:var(--accent);">Q:</span> ${int.q}</div>
                            <div class="interview-a"><strong style="color:#fff;">A:</strong> ${int.a}</div>
                        </div>`;
                });
            }

            let missionHtml = ``;
            if (currentLesson.quizzes) {
                missionHtml += `<h3>Step 1: Concept Verification</h3><p>Test your knowledge before coding.</p>`;
                currentLesson.quizzes.forEach((qObj, qIdx) => {
                    missionHtml += `<div class="quiz-card" id="quiz-${qIdx}">
                            <div class="quiz-q">${qIdx + 1}. ${qObj.q}</div>
                            ${qObj.options.map((opt, optIdx) => `
                                <div class="quiz-opt" onclick="handleQuizClick(${qIdx}, ${optIdx}, ${qObj.ans}, this)">${opt}</div>
                            `).join('')}
                        </div>`;
                });
            }

            missionHtml += `
                <h3 style="margin-top:40px;">Step 2: Interactive Coding Task</h3>
                <p>${currentLesson.exercise}</p>
                <div class="editor-container">
                    <py-repl id="mission-repl" auto-generate="true"></py-repl>
                </div>
                
                <div class="verify-box">
                    <h3 style="margin-bottom:10px; color:var(--accent-purple);">Step 3: Output Verification</h3>
                    <p style="font-size:0.95rem; margin-bottom:0;">Run your code above. What exactly did it print in the terminal?</p>
                    <input type="text" id="verifyInput" class="verify-input" placeholder="Type terminal output here..." autocomplete="off">
                    <button class="pill-btn pill-purple" onclick="verifyOutput()">Verify Output</button>
                    <div id="verifyStatus" style="margin-top: 15px; font-weight: 600;"></div>
                </div>
                <button class="pill-btn pill-primary submit-btn" onclick="submitMission()">Mark Complete & Next 🚀</button>
                <div style="clear:both;"></div>`;

            let html = `
                <h1>${currentLesson.title}</h1>
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('theory', this)">📖 Theory</button>
                    <button class="tab-btn" onclick="switchTab('code', this)">💻 Code Breakdown</button>
                    <button class="tab-btn" onclick="switchTab('interview', this)">🎯 Interview Pro</button>
                    <button class="tab-btn" onclick="switchTab('mission', this)">⚔️ Master Mission</button>
                </div>
                <div id="tab-theory" class="tab-content active">${theoryHtml}</div>
                <div id="tab-code" class="tab-content">${codeHtml}</div>
                <div id="tab-interview" class="tab-content">${interviewHtml}</div>
                <div id="tab-mission" class="tab-content">${missionHtml}</div>
            `;
            
            document.getElementById('lessonContainer').innerHTML = html;
            
            setTimeout(() => {
                const repl = document.getElementById('mission-repl');
                if (repl) repl.textContent = currentLesson.starter_code;
            }, 50);
        }

        // --- Interaction Logic ---
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            btn.classList.add('active');
        }

        window.handleQuizClick = function(qIdx, optIdx, correctAns, element) {
            if (element.classList.contains('disabled') || element.classList.contains('correct')) return;
            if (optIdx === correctAns) {
                element.classList.add('correct');
                const parent = document.getElementById(`quiz-${qIdx}`);
                parent.querySelectorAll('.quiz-opt').forEach(opt => { if (opt !== element) opt.classList.add('disabled'); });
            } else {
                element.classList.add('wrong');
                setTimeout(() => element.classList.remove('wrong'), 400);
            }
        };

        window.verifyOutput = function() {
            const input = document.getElementById('verifyInput').value.trim();
            const expected = String(currentLesson.expected_output);
            if (input === expected) {
                document.getElementById('verifyStatus').innerText = "✅ Output Verified! Great job.";
                document.getElementById('verifyStatus').style.color = "var(--success)";
            } else {
                document.getElementById('verifyStatus').innerText = "❌ Incorrect output. Check the REPL terminal!";
                document.getElementById('verifyStatus').style.color = "var(--error)";
            }
        }

        // --- Gamification Engine ---
        let playerXP = parseInt(localStorage.getItem('pm_xp')) || 0;
        function updateProfileUI() {
            let level = Math.floor(playerXP / 500) + 1;
            let currentLevelXP = playerXP % 500;
            let pct = (currentLevelXP / 500) * 100;
            document.getElementById('levelBadge').innerText = `Lvl ${level}`;
            document.getElementById('xpFill').style.width = `${pct}%`;
        }

        function fireConfetti() {
            for(let i=0; i<50; i++) {
                const conf = document.createElement('div');
                conf.style.position = 'absolute'; conf.style.width = '10px'; conf.style.height = '10px';
                conf.style.left = Math.random() * 100 + 'vw'; conf.style.top = '-10px';
                conf.style.backgroundColor = ['#a855f7', '#00e5ff', '#10b981', '#ffcc00'][Math.floor(Math.random()*4)];
                conf.style.pointerEvents = 'none'; conf.style.zIndex = '10000';
                conf.animate([
                    { transform: 'translateY(0) rotate(0)', opacity: 1 },
                    { transform: `translateY(100vh) rotate(${Math.random()*720}deg)`, opacity: 0 }
                ], { duration: Math.random() * 1500 + 1000, easing: 'linear', fill: 'forwards' });
                document.body.appendChild(conf);
                setTimeout(() => conf.remove(), 3000);
            }
        }

        function submitMission() {
            if (!completedSet.has(currentGlobalIndex)) {
                playerXP += 100;
                localStorage.setItem('pm_xp', playerXP);
                updateProfileUI();
                fireConfetti();
            }
            
            completedSet.add(currentGlobalIndex);
            localStorage.setItem('pm_completed', JSON.stringify([...completedSet]));
            
            if (currentGlobalIndex + 1 < flatCurriculum.length) { 
                loadLesson(currentGlobalIndex + 1); 
            } else { 
                renderSidebar();
                alert("Course Complete! You are a PyMastery Legend."); 
            }
        }

        // Init
        window.onload = () => {
            updateProfileUI();
            loadLesson(0);
        };
    </script>
</body>
</html>
