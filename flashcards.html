<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyMastery Flashcards</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        :root {
            /* Vercel-like Dark Mode (Default) */
            --bg-color: #0a0a0a;
            --surface: #111111;
            --text-primary: #ededed;
            --text-secondary: #a1a1aa;
            --accent: #ffffff; /* Sharp white accent */
            --border: rgba(255, 255, 255, 0.1);
            --border-hover: rgba(255, 255, 255, 0.2);
            --pill-bg: rgba(255, 255, 255, 0.05);
            --pill-hover: rgba(255, 255, 255, 0.1);
            --success: #10b981;
            --error: #ef4444;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            --code-bg: #000000;
        }

        [data-theme="light"] {
            /* Apple/Vercel Light Mode */
            --bg-color: #fafafa;
            --surface: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --accent: #000000;
            --border: rgba(0, 0, 0, 0.1);
            --border-hover: rgba(0, 0, 0, 0.2);
            --pill-bg: rgba(0, 0, 0, 0.05);
            --pill-hover: rgba(0, 0, 0, 0.1);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --code-bg: #f3f4f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            display: flex; height: 100vh; overflow: hidden; 
            -webkit-font-smoothing: antialiased; 
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- CUSTOM LOGO & BRANDING --- */
        .brand-container { display: flex; align-items: center; gap: 12px; }
        .logo-svg { width: 32px; height: 32px; }
        .logo-svg rect, .logo-svg circle { transition: fill 0.3s; }
        [data-theme="light"] .logo-svg .dark-fill { fill: #111827; }
        .brand-text { font-weight: 700; font-size: 1.25rem; letter-spacing: -0.5px; color: var(--text-primary); }

        /* --- BESPOKE PILL NAV --- */
        .top-nav { position: fixed; top: 0; left: 0; width: 100%; height: 64px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 1000; transition: background-color 0.3s, border-color 0.3s;}
        .menu-toggle { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-primary); transition: opacity 0.2s; display: flex; align-items:center; justify-content:center;}
        .menu-toggle:hover { opacity: 0.7; }

        .nav-actions { display: flex; align-items: center; gap: 12px; }
        
        .pill-btn {
            background: var(--pill-bg); color: var(--text-primary); border: 1px solid var(--border);
            padding: 6px 16px; border-radius: 9999px; font-size: 0.875rem; font-weight: 500; cursor: pointer; 
            transition: all 0.2s ease; display: flex; align-items: center; gap: 6px; text-decoration: none;
        }
        .pill-btn:hover { background: var(--pill-hover); border-color: var(--border-hover); }
        
        .pill-primary { background: var(--text-primary); color: var(--bg-color); border: 1px solid transparent; font-weight: 600; }
        .pill-primary:hover { opacity: 0.9; transform: none; box-shadow: none; border-color: transparent;}
        
        .pill-purple { background: var(--surface); color: var(--text-primary); border: 1px solid var(--border); }
        .pill-purple:hover { border-color: var(--text-primary); }

        /* --- SIDEBAR FREE ROAM --- */
        .sidebar { width: 280px; height: calc(100vh - 64px); margin-top: 64px; background: var(--bg-color); border-right: 1px solid var(--border); padding: 24px 12px; overflow-y: auto; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s, border-color 0.3s; position: absolute; left: 0; z-index: 900; }
        .sidebar.collapsed { transform: translateX(-280px); }
        
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        
        .nav-group { margin-bottom: 24px; }
        .nav-title { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; padding-left: 12px; display: flex; align-items:center; gap: 6px;}
        
        .nav-item { padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.875rem; font-weight: 500; display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; transition: all 0.2s; border: 1px solid transparent; color: var(--text-secondary);}
        .nav-item:hover { background: var(--pill-bg); color: var(--text-primary); }
        .nav-item.active { background: var(--pill-bg); color: var(--text-primary); font-weight: 600; }
        
        .status-pill { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; background: var(--border); color: var(--text-secondary); font-weight: 500;}
        .status-pill.done { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .status-pill.active { background: var(--border-hover); color: var(--text-primary); }

        /* --- MAIN CONTENT & TYPOGRAPHY --- */
        .main-content { flex: 1; height: calc(100vh - 64px); margin-top: 64px; margin-left: 280px; padding: 48px; overflow-y: auto; display: flex; justify-content: center; transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .main-content.expanded { margin-left: 0; }
        .lesson-container { background: var(--surface); border-radius: 12px; padding: 48px; max-width: 800px; width: 100%; border: 1px solid var(--border); height: fit-content; margin-bottom: 48px; box-shadow: var(--shadow); transition: background-color 0.3s, border-color 0.3s;}

        h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.04em; margin-bottom: 24px; line-height: 1.2; color: var(--text-primary);}
        h2 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; margin-top: 36px; margin-bottom: 16px; color: var(--text-primary);}
        h3 { font-size: 1.125rem; font-weight: 600; color: var(--text-primary); margin-bottom: 8px;}
        p { line-height: 1.75; color: var(--text-secondary); margin-bottom: 24px; font-size: 1.05rem; letter-spacing: 0.01em; font-weight: 400; }
        strong { color: var(--text-primary); font-weight: 600; }

        /* Tabs */
        .tabs { display: flex; gap: 8px; margin-bottom: 32px; border-bottom: 1px solid var(--border); padding-bottom: 12px; overflow-x: auto;}
        .tab-btn { background: none; border: none; font-size: 0.875rem; font-weight: 500; color: var(--text-secondary); padding: 8px 12px; cursor: pointer; border-radius: 6px; transition: all 0.2s; white-space: nowrap; font-family: 'Inter', sans-serif;}
        .tab-btn:hover { background: var(--pill-bg); color: var(--text-primary);}
        .tab-btn.active { color: var(--text-primary); background: var(--pill-bg); font-weight: 600;}
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Code & Breakdown */
        .code-block { background: var(--code-bg); padding: 20px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.875rem; overflow-x: auto; margin-bottom: 24px; border: 1px solid var(--border); color: var(--text-primary); transition: background-color 0.3s;}
        
        .breakdown-box { background: var(--bg-color); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-top: 16px; transition: background-color 0.3s, border-color 0.3s;}
        .breakdown-line { margin-bottom: 12px; font-size: 0.95rem; border-bottom: 1px solid var(--border); padding-bottom: 12px; color: var(--text-secondary);}
        .breakdown-line:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0;}
        .breakdown-line strong, .breakdown-line code { font-family: 'JetBrains Mono', monospace; background: var(--pill-bg); padding: 2px 6px; border-radius: 4px; color: var(--text-primary); font-size: 0.85rem;}

        /* Cards */
        .interview-card { background: var(--bg-color); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 16px; transition: border-color 0.2s; }
        .interview-card:hover { border-color: var(--border-hover); }
        .interview-q { font-weight: 600; font-size: 1rem; color: var(--text-primary); margin-bottom: 8px; display: flex; gap: 8px;}
        .interview-a { color: var(--text-secondary); font-size: 0.95rem; line-height: 1.5;}

        /* Quizzes */
        .quiz-card { background: var(--bg-color); border: 1px solid var(--border); border-radius: 8px; padding: 24px; margin-bottom: 24px; }
        .quiz-q { font-weight: 600; font-size: 1.1rem; margin-bottom: 16px; color: var(--text-primary);}
        .quiz-opt { background: var(--surface); border: 1px solid var(--border); padding: 12px 16px; border-radius: 6px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; font-weight: 500; color: var(--text-primary);}
        .quiz-opt:hover { border-color: var(--text-primary); }
        .quiz-opt.wrong { border-color: var(--error); background: rgba(239, 68, 68, 0.05); color: var(--error); animation: shake 0.3s; }
        .quiz-opt.correct { border-color: var(--success); background: rgba(16, 185, 129, 0.05); color: var(--success); pointer-events: none; }
        .quiz-opt.disabled { pointer-events: none; opacity: 0.5; }

        /* PyScript IDE */
        .editor-container { border-radius: 8px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 24px; box-shadow: var(--shadow);}
        py-repl { --py-repl-background: var(--code-bg); --py-repl-color: var(--text-primary); font-family: 'JetBrains Mono', monospace;}
        
        .verify-box { background: var(--bg-color); border: 1px solid var(--border); padding: 24px; border-radius: 8px; margin-bottom: 32px; transition: background-color 0.3s, border-color 0.3s;}
        .verify-input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; font-family: 'JetBrains Mono', monospace; margin-top: 12px; margin-bottom: 16px; outline: none; background: var(--code-bg); color: var(--text-primary); transition: border-color 0.2s;}
        .verify-input:focus { border-color: var(--text-primary); }
        
        .submit-btn { float: right; font-family: 'Inter', sans-serif;}

        /* --- DRAGGABLE VIDEO PILL --- */
        .floating-video {
            position: fixed; bottom: 24px; right: 24px; width: 400px; height: 240px;
            background: var(--bg-color); border-radius: 12px; box-shadow: var(--shadow);
            z-index: 10000; display: none; flex-direction: column; overflow: hidden;
            transform: translate3d(0, 0, 0); border: 1px solid var(--border);
        }
        .floating-video.active { display: flex; }
        .video-header {
            background: var(--surface); color: var(--text-primary); padding: 8px 16px; cursor: grab;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.875rem; font-weight: 500; user-select: none; border-bottom: 1px solid var(--border);
        }
        .video-header:active { cursor: grabbing; }
        .floating-video iframe { flex: 1; width: 100%; border: none; }
        .close-video { background: none; border: none; color: var(--text-secondary); font-size: 1.25rem; cursor: pointer; line-height: 1; transition: color 0.2s;}
        .close-video:hover { color: var(--text-primary); }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-container">
            <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <rect x="10" y="10" width="40" height="40" rx="8" fill="var(--text-primary)"/>
                    <rect x="50" y="50" width="40" height="40" rx="8" fill="var(--text-primary)"/>
                    <circle cx="30" cy="30" r="6" fill="var(--surface)" class="dark-fill"/>
                    <circle cx="70" cy="70" r="6" fill="var(--surface)" class="dark-fill"/>
                </svg>
            <div class="brand-text" style="background: linear-gradient(90deg, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">PyMastery <span class="subtitle">Interview Pro</span></div>
        </div>
        
        <div style="display:flex; gap: 20px; align-items:center;">
            <select id="topicFilter" class="filter-select" onchange="applyFilter()">
                <option value="All">Overall Interview Mode</option>
                <option value="Basics">Basics & Syntax</option>
                <option value="Data Structures">Data Structures</option>
                <option value="OOP">Object Oriented Programming</option>
                <option value="Advanced">Advanced (Decorators, Generators)</option>
                <option value="Machine Learning">Machine Learning</option>
            </select>
            
            <div class="progress-wrapper">
                <div class="mastered-count" id="countDisplay">0 / 0 Mastered</div>
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            </div>
        </div>
    </div>

    <div class="app-container">
        <!-- End Screen -->
        <div class="end-screen" id="endScreen">
            <h1>🏆 Mastery Complete!</h1>
            <p>You have successfully conquered all questions in this category.</p>
            <button class="pill-btn btn-master" onclick="resetDeck()">Restart Deck</button>
        </div>

        <!-- Card UI -->
        <div class="scene" id="cardScene">
            <div class="card" id="flashcard" onclick="flipCard()">
                
                <!-- FRONT -->
                <div class="card-face card-front">
                    <div class="card-header"><span class="topic-tag" id="cardTopic">Topic</span></div>
                    <div class="card-content"><div class="card-q" id="cardQ">Question goes here</div></div>
                    <div class="card-footer"><div class="hint-text">Click card to reveal answer</div></div>
                </div>
                
                <!-- BACK -->
                <div class="card-face card-back">
                    <div class="card-header"><span class="topic-tag" id="cardTopicBack">Topic</span></div>
                    <div class="card-content"><div class="card-a" id="cardA">Answer goes here</div></div>
                    <div class="card-footer"><div class="hint-text">Click to hide</div></div>
                </div>

            </div>
        </div>
        
        <div class="controls" id="controls">
            <button class="pill-btn btn-skip" id="btnSkip" onclick="skipCard()">Skip (Review Later)</button>
            <button class="pill-btn btn-master" id="btnMaster" onclick="masterCard()">✅ Mastered!</button>
        </div>

    </div>

    <script>
        const database = [
            { q: "What is dynamic typing in Python?", a: "You don't have to specify the type of a variable (like int or string) when creating it. Python figures it out at runtime.", topic: "Basics" },
            { q: "Does Python use braces {} for if statements?", a: "No, Python uses indentation (spaces/tabs) to define code blocks.", topic: "Basics" },
            { q: "What is the difference between break and continue?", a: "Break completely exits the loop. Continue skips the rest of the current iteration and moves to the next one.", topic: "Basics" },
            { q: "What is the difference between a parameter and an argument?", a: "Parameter is the variable in the function declaration. Argument is the actual value passed in when calling.", topic: "Basics" },
            
            { q: "What is the time complexity of looking up a key in a dictionary?", a: "O(1) average case, because it uses a hash table internally.", topic: "Data Structures" },
            { q: "Are Python Tuples mutable or immutable?", a: "Immutable. Once created, you cannot change, add, or remove items. This makes them faster and more memory-efficient than Lists.", topic: "Data Structures" },
            { q: "How do you safely avoid a KeyError in a dictionary?", a: "Use the .get() method instead of bracket notation. e.g., my_dict.get('key', 'default_value')", topic: "Data Structures" },
            { q: "What is a List Comprehension?", a: "A concise, C-speed syntax to create a new list based on an existing list. Example: [x*x for x in nums]", topic: "Data Structures" },
            { q: "What is the difference between shallow copy and deep copy?", a: "copy() copies outer container references. deepcopy() creates fully independent clones recursively.", topic: "Data Structures" },
            
            { q: "What is 'self' in a Python class?", a: "It binds the attributes with the given arguments. It's how methods know which instance of the object they belong to.", topic: "OOP" },
            { q: "What does the super() function do?", a: "It returns a temporary object of the superclass, allowing you to call its methods (like its __init__ constructor).", topic: "OOP" },
            { q: "Are private variables truly private in Python?", a: "No, nothing is strictly private. The __ double underscore just 'mangles' the name to prevent accidental access.", topic: "OOP" },
            { q: "What is a dunder/magic method?", a: "Methods with double underscores before and after, like __init__ or __str__, that hook into built-in Python behaviors.", topic: "OOP" },
            
            { q: "What is a Decorator fundamentally?", a: "A higher-order function that takes a function as an argument and returns a modified function, without permanently changing the source code.", topic: "Advanced" },
            { q: "Why use yield instead of return?", a: "Return sends everything at once, consuming memory. Yield streams items one at a time, creating a Generator that is highly memory-efficient.", topic: "Advanced" },
            { q: "What do *args and **kwargs do?", a: "*args packs extra positional arguments into a Tuple. **kwargs packs extra named arguments into a Dictionary.", topic: "Advanced" },
            { q: "What is an anonymous function?", a: "A Lambda function. A small, one-line function without a def block, used for short throwaway logic.", topic: "Advanced" },
            
            { q: "What is the difference between a Pandas Series and a DataFrame?", a: "A Series is a 1D column. A DataFrame is a 2D table made up of multiple Series.", topic: "Machine Learning" },
            { q: "Why is NumPy faster than Python lists?", a: "NumPy arrays are stored continuously in memory and use C-backed vectorization to apply operations to entire arrays instantly.", topic: "Machine Learning" },
            { q: "What does the fit() function do in Scikit-Learn?", a: "It trains the Machine Learning algorithm on the provided dataset.", topic: "Machine Learning" },
            { q: "What is overfitting?", a: "When a model learns the training data too perfectly (memorizing noise), causing it to perform poorly on new, unseen data.", topic: "Machine Learning" }
        ];

        let currentDeck = [];
        let currentIndex = 0;
        let masteredCount = 0;
        let totalCards = 0;
        
        const cardEl = document.getElementById('flashcard');
        const btnSkip = document.getElementById('btnSkip');
        const btnMaster = document.getElementById('btnMaster');
        let isFlipped = false;
        let isAnimating = false;

        function applyFilter() {
            const filter = document.getElementById('topicFilter').value;
            if (filter === "All") {
                currentDeck = [...database];
            } else {
                currentDeck = database.filter(q => q.topic === filter);
            }
            
            currentDeck.sort(() => Math.random() - 0.5);
            
            totalCards = currentDeck.length;
            masteredCount = 0;
            currentIndex = 0;
            isFlipped = false;
            cardEl.classList.remove('is-flipped');
            
            updateUI();
        }

        function updateUI() {
            if (currentDeck.length === 0) {
                document.getElementById('cardScene').style.display = 'none';
                document.getElementById('controls').style.display = 'none';
                document.getElementById('endScreen').style.display = 'flex';
                fireConfetti();
            } else {
                document.getElementById('cardScene').style.display = 'block';
                document.getElementById('controls').style.display = 'flex';
                document.getElementById('endScreen').style.display = 'none';
                loadCardData();
            }
            
            document.getElementById('countDisplay').innerText = `${masteredCount} / ${totalCards} Mastered`;
            const pct = totalCards === 0 ? 0 : (masteredCount / totalCards) * 100;
            document.getElementById('progressFill').style.width = `${pct}%`;
        }

        function loadCardData() {
            if(currentDeck.length > 0) {
                document.getElementById('cardQ').innerText = currentDeck[currentIndex].q;
                document.getElementById('cardA').innerText = currentDeck[currentIndex].a;
                document.getElementById('cardTopic').innerText = currentDeck[currentIndex].topic;
                document.getElementById('cardTopicBack').innerText = currentDeck[currentIndex].topic;
            }
        }

        function flipCard() {
            if (isAnimating) return;
            isFlipped = !isFlipped;
            cardEl.classList.toggle('is-flipped');
        }

        function setButtonsDisabled(disabled) {
            btnSkip.disabled = disabled;
            btnMaster.disabled = disabled;
        }

        function skipCard() {
            if (isAnimating || currentDeck.length === 0) return;
            isAnimating = true;
            setButtonsDisabled(true);
            
            const card = currentDeck.splice(currentIndex, 1)[0];
            currentDeck.push(card);

            if (isFlipped) {
                isFlipped = false;
                cardEl.classList.remove('is-flipped');
                setTimeout(() => animateCardChange('left'), 300);
            } else {
                animateCardChange('left');
            }
        }

        function masterCard() {
            if (isAnimating || currentDeck.length === 0) return;
            isAnimating = true;
            setButtonsDisabled(true);
            
            currentDeck.splice(currentIndex, 1);
            masteredCount++;

            if (isFlipped) {
                isFlipped = false;
                cardEl.classList.remove('is-flipped');
                setTimeout(() => animateCardChange('right'), 300);
            } else {
                animateCardChange('right');
            }
        }

        function animateCardChange(direction) {
            const outClass = direction === 'left' ? 'animate-out-left' : 'animate-out-right';
            const inClass = direction === 'left' ? 'animate-in-right' : 'animate-in-left';
            
            cardEl.classList.add(outClass);
            
            cardEl.addEventListener('animationend', function handler(e) {
                if (e.animationName === 'swipeOutLeft' || e.animationName === 'swipeOutRight') {
                    cardEl.removeEventListener('animationend', handler);
                    
                    if (currentDeck.length > 0) {
                        loadCardData();
                        cardEl.classList.remove(outClass);
                        cardEl.classList.add(inClass);
                        
                        cardEl.addEventListener('animationend', function handlerIn(e2) {
                            if (e2.animationName === 'swipeInRight' || e2.animationName === 'swipeInLeft') {
                                cardEl.removeEventListener('animationend', handlerIn);
                                cardEl.classList.remove(inClass);
                                isAnimating = false;
                                setButtonsDisabled(false);
                            }
                        });
                    } else {
                        cardEl.classList.remove(outClass);
                        updateUI(); 
                        isAnimating = false;
                        setButtonsDisabled(false);
                    }
                }
            });
            
            document.getElementById('countDisplay').innerText = `${masteredCount} / ${totalCards} Mastered`;
            const pct = totalCards === 0 ? 0 : (masteredCount / totalCards) * 100;
            document.getElementById('progressFill').style.width = `${pct}%`;
        }

        function resetDeck() {
            applyFilter();
        }

        function fireConfetti() {
            for(let i=0; i<80; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = -10 + 'px';
                conf.style.backgroundColor = ['#a855f7', '#00e5ff', '#ff3b30', '#10b981', '#fbbf24'][Math.floor(Math.random()*5)];
                conf.style.animationDuration = (Math.random() * 1.5 + 0.5) + 's';
                document.body.appendChild(conf);
                setTimeout(() => conf.remove(), 3000);
            }
        }

        applyFilter();
    </script>\n<script>
        // Theme Toggle
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('pm_theme', next);
        }
        
        // Initialize Theme
        const savedTheme = localStorage.getItem('pm_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
</script>\n</body>
</html>
